[platformio]
default_envs = esp32s3
; Arduino-style layout: the .ino lives in the project root, not in src/
src_dir = .

[env:esp32s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
; Hardware-validated S3-Zero configuration (see ../ESP32-S3-ZERO-NOTES.md).
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
board_build.partitions = default.csv
framework = arduino
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOOP_STACK_SIZE=65536
build_src_filter = +<*.ino> +<*.cpp>
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library@1.0.6
    https://github.com/Pickleball-Instruments/Payload.git#v1.1.0
    https://github.com/StevenRS11/NFC.git#v1.0.0
; PaddleDNA (Payload) and PaddleDNA-NFC are pinned by tag; bump the tag to take a library change.
